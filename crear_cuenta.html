<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Tecnología Digital</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="auth-body">

    <main class="auth-container">
        <section class="auth-card auth-card-grande">
            <div class="auth-logo">
                <img src="logo.png" alt="Tecnología Digital" class="logo-img">
                <h1>Tecnología Digital</h1>
                <p>Registro de usuario</p>
            </div>

            <form id="formCrearCuenta" class="formulario">
                <h2>Crear cuenta</h2>

                <div class="grid-form">
                    <div class="grupo-form">
                        <label for="cedula">Cédula</label>
                        <input type="text" id="cedula" name="cedula" placeholder="Ingrese su cédula" required>
                    </div>

                    <div class="grupo-form">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
                    </div>

                    <div class="grupo-form">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required>
                    </div>

                    <div class="grupo-form">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" name="telefono" placeholder="0987021100" required>
                    </div>

                    <div class="grupo-form">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="grupo-form">
                        <label for="contraseña">Contraseña</label>
                        <input type="password" id="contraseña" name="contraseña" placeholder="Mínimo 8 caracteres" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-principal">Registrar cuenta</button>

                <div id="mensajeCrearCuenta" class="mensaje"></div>

                <p class="auth-link">
                    ¿Ya tienes cuenta?
                    <a href="login.html">Iniciar sesión</a>
                </p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
